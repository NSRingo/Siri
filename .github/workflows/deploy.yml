name: Deploy
on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - dev

permissions:
  actions: read
  contents: read

jobs:
  debug:
    uses: ./.github/workflows/dev.yml
    secrets: inherit
  cloudflare:
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          ref: dev
      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: 'latest'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      - name: Deploy api-smoot Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: |
            whoami
            deploy --minify -c wrangler.workers.jsonc
      - name: Deploy api-smoot Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: pages deploy pages --project-name api-smoot --branch dev --commit-hash ${{ github.sha }}
  deploy:
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@master
        with:
          name: artifact
      - name: Deploy Request
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/request.dev.bundle.js
      - name: Deploy Response
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/response.dev.bundle.js
      - name: Deploy Siri Surge Module
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Siri.dev.sgmodule
      - name: Deploy Siri Loon Plugin
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Siri.dev.plugin
      - name: Deploy Siri Quantumult X Snippet
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Siri.dev.snippet
      - name: Deploy Siri Stash Override
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Siri.dev.stoverride
      - name: Deploy Search Surge Module
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Search.dev.sgmodule
      - name: Deploy Search Loon Plugin
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Search.dev.plugin
      - name: Deploy Search Quantumult X Snippet
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Search.dev.snippet
      - name: Deploy Search Stash Override
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Search.dev.stoverride
      - name: Deploy Spotlight Surge Module
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Spotlight.dev.sgmodule
      - name: Deploy Spotlight Loon Plugin
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Spotlight.dev.plugin
      - name: Deploy Spotlight Stash Override
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
          gist_description: " iRingo: ⭕ Siri β"
          file_path: dist/iRingo.Spotlight.dev.stoverride
      - name: Deploy Wikipedia Ruleset (list)
        uses: exuanbo/actions-deploy-gist@main
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: b5f0de011fabe5637ff53e585e9d061d
